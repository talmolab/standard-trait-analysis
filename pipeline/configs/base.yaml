run_name: run_${now:%Y-%m-%d_%H-%M-%S}
output_dir: pipeline_runs/${run_name}

logging:
  level: INFO
  log_dir: ${output_dir}/logs

input:
  traits_csv: "tests/data/traits_summary.csv"
  experimental_design_excel: "tests/data/Wheat_EDPIE_cylinder_master_data.xlsx"
  experimental_design_sheet: "Redo_Master_Data"

steps:
  - make_csvs
  - data_cleanup
  - PCA_for_outlier_detection
  # - pca
  # - umap


# If `mahalanobis` is set (e.g., 25), use Mahalanobis distance.
# If null, fall back to GMM-based detection with BIC-selected components.

parameters:
  col_start: 33
  genotype_col_name: "Geno"
  thresholds:
    nan: 0.20
    zero: 0.40
    outlier: 0.90
    mahalanobis: 100
